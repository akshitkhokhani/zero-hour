name: CI

on:
  push:
    branches: [main]
  pull_request:

# one run per branch/PR; a new push cancels the superseded run
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
        exclude:
          # ubuntu-latest is Ubuntu 26.04 since 2026-10-19 and ships no Python 3.9 (EOL).
          # 3.9 stays covered on macOS and Windows.
          - os: ubuntu-latest
            python: "3.9"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Unit tests
        timeout-minutes: 8
        run: python -m unittest discover -s tests -v

      - name: Incident card index is up to date
        run: python tools/build_index.py --check

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Node CLI shim
        run: node bin/zerohour.js --help
