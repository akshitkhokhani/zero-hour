version = 1
requires-python = ">=3.12"

[[package]]
name = "certifi"
version = "2024.8.30"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "crewai"
version = "0.86.0"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "litellm" },
    { name = "pydantic" },
]

[[package]]
name = "httpx"
version = "0.27.2"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "certifi" },
]

[[package]]
name = "litellm"
version = "1.107.0"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "httpx" },
    { name = "pydantic" },
]

[[package]]
name = "litellm-app"
version = "0.1.0"
source = { editable = "." }
dependencies = [
    { name = "crewai" },
]

[package.metadata]
requires-dist = [{ name = "crewai", specifier = ">=0.80" }]

[[package]]
name = "pydantic"
version = "2.9.2"
source = { registry = "https://pypi.org/simple" }
